<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7bbabb">
<title>Orée — spike DOM/SVG</title>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<svg id="defs" width="0" height="0" aria-hidden="true" focusable="false"></svg>

<main class="viewport" id="viewport" aria-label="Carte de l’Orée">
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="clouds" id="clouds" aria-hidden="true"></div>
  <div class="camera" id="camera">
    <div class="shake" id="shake">
      <div class="world" id="world">
        <div class="layer" id="shadows" aria-hidden="true"></div>
        <div class="layer" id="groundfx" aria-hidden="true"><div id="ring" hidden></div></div>
        <div class="layer" id="entities"></div>
        <div class="layer" id="worldfx" aria-hidden="true"><i class="cloudshadow"></i></div>
      </div>
    </div>
  </div>
</main>

<header class="hud" aria-label="Ressources">
  <div class="chip c-energie" data-res="energie"><span class="ic" data-icon="energie"></span><b>0</b><span class="lbl">Énergie</span></div>
  <div class="chip c-materiaux" data-res="materiaux"><span class="ic" data-icon="materiaux"></span><b>0</b><span class="lbl">Matériaux</span></div>
  <div class="chip c-confiance" data-res="confiance"><span class="ic" data-icon="confiance"></span><b>0</b><span class="lbl">Confiance</span></div>
</header>

<section class="panel" aria-label="Actions">
  <div class="quest">
    <div class="q-txt">
      <span class="q-k">Prochaine quête</span>
      <strong>Sortir le bac de recyclage</strong>
      <span class="q-meta">Maison · 5 min · facile</span>
    </div>
    <button class="btn primary" id="b-quest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Terminer</button>
  </div>
  <div class="row2">
    <button class="btn" id="b-build"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9M10 19v-5h4v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Construire</span></button>
    <button class="btn" id="b-harvest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M12 13c-3 0-5-2-5-5 3 0 5 2 5 5zm0 0c3 0 5-2 5-5-3 0-5 2-5 5zm0-4c-2 0-3.2-1.6-3.2-3.8C11 5.2 12 6.8 12 9zm0 0c2 0 3.2-1.6 3.2-3.8C13 5.2 12 6.8 12 9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Récolter</span></button>
  </div>
  <div class="timebar">
    <label for="hour"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="sr-only">Heure du jour</span> <output id="hour-out">14 h 00</output></label>
    <input type="range" id="hour" min="0" max="24" step="0.25" value="14">
    <button class="btn small" id="b-now" aria-pressed="true">Maintenant</button>
    <button class="btn icon" id="b-rm" aria-pressed="false" aria-label="Animations réduites" title="Animations réduites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  </div>
</section>

<div class="fx-overlay" id="overlay" aria-hidden="true"></div>
<div class="sr-only" id="live" aria-live="polite"></div>
</body>
</html>
