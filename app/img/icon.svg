<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône de l'Orée : ciel du matin, lac, île en strates et la lanterne du Relais. Pleine page (masquable) :
       l'île tient dans le cercle central de 80 %. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccbe0"/>
      <stop offset=".56" stop-color="#eef0d2"/>
      <stop offset=".56" stop-color="#7bbabb"/>
      <stop offset="1" stop-color="#5b9ca3"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd98c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ciel)"/>
  <ellipse cx="256" cy="398" rx="150" ry="20" fill="#1d3336" opacity=".16"/>
  <!-- socle en strates -->
  <polygon points="106,268 256,343 256,351 106,276" fill="#86a556"/>
  <polygon points="106,276 256,351 256,392 106,317" fill="#a3683f"/>
  <polygon points="106,298 256,373 256,392 106,317" fill="#8c5a3b"/>
  <polygon points="256,343 406,268 406,276 256,351" fill="#6f8c47"/>
  <polygon points="256,351 406,276 406,317 256,392" fill="#7a492d"/>
  <polygon points="256,373 406,298 406,317 256,392" fill="#64412e"/>
  <!-- dessus et chemins -->
  <polygon points="256,193 406,268 256,343 106,268" fill="#a9bf6c"/>
  <polygon points="190,226 340,301 322,310 172,235" fill="#e8d29f"/>
  <polygon points="322,226 340,235 190,310 172,301" fill="#e8d29f"/>
  <!-- champs -->
  <polygon points="166,242 214,266 203,271.5 155,247.5" fill="#a3683f"/>
  <polygon points="148,251 196,275 185,280.5 137,256.5" fill="#8fc25c"/>
  <polygon points="130,260 178,284 167,289.5 119,265.5" fill="#e6c163"/>
  <!-- arbres -->
  <polygon points="300,236 310,206 310,239" fill="#87a65b"/><polygon points="310,239 310,206 320,236" fill="#5d8150"/>
  <polygon points="332,252 342,222 342,255" fill="#87a65b"/><polygon points="342,255 342,222 352,252" fill="#5d8150"/>
  <polygon points="300,284 310,254 310,287" fill="#87a65b"/><polygon points="310,287 310,254 320,284" fill="#5d8150"/>
  <!-- Relais et sa lanterne -->
  <polygon points="236,300 256,310 256,246 236,236" fill="#d4c9af"/>
  <polygon points="256,310 276,300 276,236 256,246" fill="#b2a58a"/>
  <polygon points="256,226 276,236 256,246 236,236" fill="#e6ddc6"/>
  <circle cx="256" cy="206" r="46" fill="url(#halo)"/>
  <polygon points="256,186 264,192 256,224 248,192" fill="#f3c879"/>
  <circle cx="256" cy="200" r="5" fill="#fff8e8"/>
</svg>
